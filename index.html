<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Phone Tap Counter</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <section class="card">
        <p class="eyebrow">Tiny phone app</p>
        <h1 id="app-title">Tap Counter</h1>
        <p class="helper">Tap the big button and keep score. Your count stays saved on this device.</p>

        <output id="count" class="count" aria-live="polite">0</output>

        <div class="actions" aria-label="Counter controls">
          <button id="tapButton" class="tap-button" type="button">Tap me</button>
          <button id="resetButton" class="reset-button" type="button">Reset</button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
